<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>方向 A · 大字馆铭 · 财跃启明星</title>
<style>
  :root {
    --ink: #2c2c2e;
    --on-ink: #f5f5f7;
    --page: #f5f5f7;
    --card: #fbfbfa;
    --gray: #656a71;
    --line: #e2e2e6;
    --brand: #c2351b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid;
    grid-template-columns: minmax(0, 1.15fr) minmax(380px, 0.85fr);
    min-height: 100vh;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--page);
  }
  .brand {
    position: relative;
    overflow: hidden;
    background: var(--ink);
    color: var(--on-ink);
    padding: 56px 64px 48px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  .brand::before {
    content: "";
    position: absolute;
    right: -8%;
    top: 18%;
    width: 420px;
    height: 420px;
    background: radial-gradient(circle, rgba(194,53,27,.22) 0%, rgba(194,53,27,.06) 42%, transparent 70%);
    pointer-events: none;
  }
  .brand-logo {
    position: absolute;
    top: 48px;
    left: 64px;
    width: 56px;
    height: 56px;
    border-radius: 14px;
  }
  .brand h1 {
    position: relative;
    font-family: "Songti SC", "Noto Serif SC", "STSong", serif;
    font-weight: 700;
    font-size: clamp(56px, 7vw, 96px);
    line-height: 1.02;
    letter-spacing: -0.04em;
    text-wrap: pretty;
  }
  .brand h1 span {
    display: block;
    font-size: 0.38em;
    font-weight: 500;
    letter-spacing: 0.18em;
    margin-bottom: 10px;
    opacity: .72;
  }
  .slogan {
    position: relative;
    margin-top: 28px;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: rgba(245,245,247,.78);
  }
  .form-pane {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 48px;
    background: var(--page);
  }
  form {
    width: min(360px, 100%);
  }
  .kicker {
    font-size: 12px;
    letter-spacing: 0.16em;
    color: var(--gray);
    margin-bottom: 10px;
  }
  .form-title {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 28px;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--gray);
    margin-bottom: 6px;
  }
  input {
    width: 100%;
    height: 40px;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0 12px;
    background: var(--card);
    font-size: 14px;
    color: var(--ink);
    outline: none;
  }
  input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(44,44,46,.08); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }
  .ghost {
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    font-size: 13px;
    color: var(--ink);
    white-space: nowrap;
  }
  .field { margin-bottom: 16px; }
  .submit {
    width: 100%;
    height: 42px;
    margin-top: 8px;
    border: 0;
    border-radius: 8px;
    background: var(--ink);
    color: var(--on-ink);
    font-size: 14px;
    font-weight: 600;
  }
  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; }
    .brand { min-height: 38vh; padding: 36px 28px 32px; }
    .brand-logo { top: 28px; left: 28px; }
  }
</style>
</head>
<body>
  <section class="brand">
    <img class="brand-logo" src="../assets/logo-qmx-v1.0-20260731.png" alt="" />
    <h1><span>财跃</span>启明星</h1>
    <p class="slogan">核清每一笔投后</p>
  </section>
  <section class="form-pane">
    <form action="#" onsubmit="return false">
      <div class="kicker">机构工作台</div>
      <div class="form-title">手机号登录</div>
      <div class="field">
        <label for="p">手机号</label>
        <input id="p" value="13800138000" />
      </div>
      <div class="field">
        <label for="c">验证码</label>
        <div class="row">
          <input id="c" value="123456" />
          <button class="ghost" type="button">获取验证码</button>
        </div>
      </div>
      <button class="submit" type="submit">登录</button>
    </form>
  </section>
</body>
</html>
